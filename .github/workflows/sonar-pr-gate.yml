name: SonarQube Pull Request Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, master ] # Change to your target delivery branches

jobs:
  analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial: Disables shallow clones so SonarQube can accurately run code diffs

      - name: Setup Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # The underlying SonarQube scanner requires Java 17+ to run its backend tasks

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarQube Scanner Global Tool
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to authorize GitHub PR Decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"biztoolsportal_ShopEase.Product" \
            /o:"biztoolsportal" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**, **/wwwroot/**"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Web API Project
        run: dotnet build --configuration Release --no-restore

      - name: Execute Tests & Generate Code Coverage
        run: |
          dotnet test --configuration Release \
            --no-build \
            --logger "trx" \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube Scan & Publish Results
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
